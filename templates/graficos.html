<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indicadores y Métricas</title>
    <link rel="stylesheet" href="{{url_for('static', filename='css/styles.css')}}">
</head>
<body>
    <header>
        <h1>Calidad de Vida DCC</h1>
    </header>

    <nav>
        <ul>
            <li><a href="{{url_for('index')}}">Inicio</a></li>
            <li><a href="{{url_for('listado_miembros')}}">Listado de Miembros</a></li>
            <li><a href="{{url_for('registro_miembros')}}">Registrar Miembro</a></li>
            <li><a href="{{url_for('registro_actividades')}}">Registrar Actividad</a></li>
            <li><a href="{{url_for('graficos')}}">Métricas</a></li>
        </ul>
    </nav>

    <main>
        <section>
            <h2>Métricas</h2>
            <p>Indicadores generales de participación en la comunidad.</p>
        </section>

        <section>
            <h2>Gráficos</h2>

            <div style="display: flex; flex-wrap: wrap; gap: 40px; margin-top: 20px;">
                <div style="width: 500px;">
                    <h3>Miembros registrados por día</h3>
                    <canvas id="graficoMiembrosPorDia"></canvas>
                </div>

                <div style="width: 400px;">
                    <h3>Actividades por tipo</h3>
                    <canvas id="graficoActividadesTipo"></canvas>
                </div>

                <div style="width: 600px;">
                    <h3>Actividades por comuna</h3>
                    <canvas id="graficoActividadesComuna"></canvas>
                </div>
            </div>
        </section>

        <p>
            <a href="{{url_for('index')}}">Volver a la portada</a>
        </p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{url_for('static', filename='js/plots.js')}}"></script>
</body>
</html>
